<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医经方智能诊断</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2430; --ink-2:#5b6472; --line:#e3e8ef;
    --brand:#1f6feb; --brand-soft:#e8f1ff; --ok:#1a7f37; --ok-soft:#e8f6ec;
    --warn:#9a6700; --warn-soft:#fff8e1; --bad:#b42318; --bad-soft:#fdecea;
    --accent:#7a5af8; --accent-soft:#f1edff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;line-height:1.6}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 64px}
  header h1{margin:0 0 4px;font-size:24px;letter-spacing:.5px}
  header p{margin:0;color:var(--ink-2);font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:18px;
        box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .card h2{margin:0 0 12px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .card h2 .idx{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--brand-soft);
        color:var(--brand);font-size:12px;align-items:center;justify-content:center;font-weight:700}
  textarea{width:100%;min-height:92px;padding:12px;border:1px solid var(--line);border-radius:8px;
        font-size:14px;font-family:inherit;resize:vertical;background:#fff;color:var(--ink)}
  textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;
        padding:8px 14px;font-size:13px;font-family:inherit;transition:.15s}
  button:hover{border-color:var(--brand);color:var(--brand)}
  button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.primary:hover{background:#1a5fd0;color:#fff}
  button.primary:disabled{opacity:.5;cursor:not-allowed}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;
        border:1px solid transparent;margin:0 6px 6px 0}
  .chip.ok{background:var(--ok-soft);color:var(--ok);border-color:#bfe3c9}
  .chip.warn{background:var(--warn-soft);color:var(--warn);border-color:#f0dfa8}
  .chip.bad{background:var(--bad-soft);color:var(--bad);border-color:#f3c2bd}
  .chip.plain{background:#f2f4f7;color:var(--ink-2);border-color:var(--line)}
  .chip.clickable{cursor:pointer}
  .chip.clickable:hover{filter:brightness(.96)}
  .chip .x{opacity:.6;font-weight:700}
  .muted{color:var(--ink-2);font-size:12.5px}
  .steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .step{font-size:12px;padding:5px 10px;border-radius:999px;background:#f2f4f7;color:var(--ink-2);
        border:1px solid var(--line);white-space:nowrap}
  .step.done{background:var(--ok-soft);color:var(--ok);border-color:#bfe3c9}
  .step.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  .step.new{box-shadow:inset 0 0 0 1px var(--accent);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .kv{background:#fafbfc;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .kv .k{font-size:12px;color:var(--ink-2)}
  .kv .v{font-size:16px;font-weight:600;margin-top:2px}
  .kv.hl{background:var(--accent-soft);border-color:#ddd4ff}
  .kv.hl .v{color:var(--accent)}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--ink-2);font-weight:600;font-size:12px;background:#fafbfc}
  .herb{display:inline-block;padding:3px 9px;border-radius:6px;background:#f2f4f7;margin:0 6px 6px 0;font-size:13px}
  .herb.add{background:var(--ok-soft);color:var(--ok)}
  .herb.del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
  .alert{border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
  .alert.err{background:var(--bad-soft);color:var(--bad);border:1px solid #f3c2bd}
  .alert.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #f0dfa8}
  .alert.info{background:var(--brand-soft);color:var(--brand);border:1px solid #cfe0ff}
  .explain{background:#fafbfc;border-left:3px solid var(--brand);border-radius:0 8px 8px 0;padding:12px 14px;
        font-size:14px;margin-top:10px}
  .hide{display:none}
  .cand{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .cand button{padding:4px 10px;font-size:12.5px;border-radius:999px}
  .cand button.sel{background:var(--brand);color:#fff;border-color:var(--brand)}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid #cfe0ff;border-top-color:var(--brand);
        border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;background:#f2f4f7;color:var(--ink-2);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>中医经方智能诊断</h1>
    <p>自然语言症状 → 症状实例个体映射 → 八纲 · 六经 · 方证 · 兼夹证 → 母方 → 加减药（方后注） → 诊断解释</p>
  </header>

  <!-- 流程步骤条 -->
  <div class="card">
    <h2><span class="idx">流</span>诊断流程</h2>
    <div class="steps" id="steps"></div>
  </div>

  <!-- 输入 -->
  <div class="card">
    <h2><span class="idx">1</span>输入症状</h2>
    <textarea id="text" placeholder="例如：发烧怕冷，两边肋骨下面胀痛，还老想吐"></textarea>
    <div class="row">
      <button class="primary" id="btnStart">开始诊断</button>
      <span class="muted">示例：</span>
      <button class="ex">发烧怕冷，两边肋骨下面胀痛，还老想吐</button>
      <button class="ex">咳嗽，口渴，心烦</button>
      <button class="ex">拉肚子，肚子胀，手脚冰凉</button>
    </div>
    <div id="startMsg"></div>
  </div>

  <!-- 映射确认 -->
  <div class="card hide" id="confirmCard">
    <h2><span class="idx">2</span>确认症状映射</h2>
    <div id="confirmBody"></div>
    <div class="row">
      <button class="primary" id="btnConfirm">确认并继续</button>
      <button id="btnRerun">按当前选择重新映射</button>
    </div>
  </div>

  <!-- 结果 -->
  <div class="card hide" id="resultCard">
    <h2><span class="idx">3</span>诊断结果</h2>
    <div id="resultBody"></div>
  </div>
</div>

<script>
const STEPS = [
  {id:'symptom-mapping',        label:'症状映射'},
  {id:'confirm',                label:'症状确认'},
  {id:'sizhen-input',           label:'录入四诊'},
  {id:'ontology-consistency-check', label:'一致性检查'},
  {id:'bagang-classification',  label:'八纲分类'},
  {id:'liujing-classification', label:'六经分类'},
  {id:'fangzheng-classification', label:'方证分类'},
  {id:'jianjiazheng-classification', label:'兼夹证分类'},
  {id:'prescription-recommendation', label:'母方推荐'},
  {id:'herb-modification',      label:'加减药'},
  {id:'diagnosis-explanation',  label:'诊断解释'}
];
const NEW_STEPS = new Set(['symptom-mapping','herb-modification','confirm']);

let currentKey = null;
let pollTimer = null;
let mappingState = null;   // {detail:[], rejected:Set, chosen:Map<text,fragment>, extra:[]}

function renderSteps(activeId, doneIds){
  const box = document.getElementById('steps');
  box.innerHTML = '';
  STEPS.forEach(s=>{
    const d = document.createElement('div');
    d.className = 'step' + (NEW_STEPS.has(s.id)?' new':'');
    if (doneIds && doneIds.has(s.id)) d.className += ' done';
    if (activeId === s.id) d.className += ' active';
    d.textContent = s.label;
    box.appendChild(d);
  });
}

function stepsForStatus(status, mapping){
  const done = new Set();
  if (status === 'AWAITING_CONFIRMATION'){
    done.add('symptom-mapping');
    return {active:'confirm', done};
  }
  if (status === 'AWAITING_REVISION'){
    ['symptom-mapping','confirm','sizhen-input','ontology-consistency-check',
     'bagang-classification','liujing-classification','fangzheng-classification',
     'jianjiazheng-classification','prescription-recommendation','herb-modification',
     'diagnosis-explanation'].forEach(x=>done.add(x));
    return {active:null, done};
  }
  if (status === 'COMPLETED'){
    STEPS.forEach(s=>done.add(s.id));
    return {active:null, done};
  }
  done.add('symptom-mapping');
  return {active:'sizhen-input', done};
}

// ---------------- 启动 ----------------
document.getElementById('btnStart').onclick = start;
document.querySelectorAll('.ex').forEach(b=> b.onclick = ()=>{ document.getElementById('text').value = b.textContent; });

async function start(){
  const text = document.getElementById('text').value.trim();
  if(!text){ msg('startMsg','err','请先输入症状描述'); return; }
  const btn = document.getElementById('btnStart');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>诊断中…';
  document.getElementById('startMsg').innerHTML = '';
  document.getElementById('confirmCard').classList.add('hide');
  document.getElementById('resultCard').classList.add('hide');
  renderSteps('symptom-mapping', new Set());
  try{
    const r = await fetch('/api/diagnosis', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})});
    const j = await r.json();
    if(!r.ok){ msg('startMsg','err', j.error || '启动失败'); return; }
    currentKey = j.processInstanceKey;
    handle(j);
  }catch(e){ msg('startMsg','err','请求失败：'+e); }
  finally{ btn.disabled=false; btn.textContent='开始诊断'; }
}

// ---------------- 轮询 ----------------
function poll(){
  clearTimeout(pollTimer);
  if(!currentKey) return;
  pollTimer = setTimeout(async ()=>{
    try{
      const r = await fetch('/api/diagnosis/'+currentKey);
      const j = await r.json();
      if(r.ok) handle(j); else poll();
    }catch(e){ poll(); }
  }, 700);
}

function handle(j){
  const st = j.status;
  const s = stepsForStatus(st, j.mapping);
  renderSteps(s.active, s.done);

  if(st === 'AWAITING_CONFIRMATION'){ renderConfirm(j.mapping); document.getElementById('resultCard').classList.add('hide'); }
  else if(st === 'COMPLETED'){ document.getElementById('confirmCard').classList.add('hide'); renderResult(j); }
  else if(st === 'AWAITING_REVISION'){ document.getElementById('confirmCard').classList.add('hide'); renderResult(j); }
  else { poll(); }
}

// ---------------- 映射确认 ----------------
function renderConfirm(m){
  mappingState = {detail: (m.detail||[]), rejected:new Set(), chosen:new Map(), extra:[]};
  const box = document.getElementById('confirmBody');
  box.innerHTML = '';

  const info = document.createElement('div');
  info.className = 'alert info';
  info.innerHTML = (m.summary||'') + (m.llmAvailable ? ' · 大模型可用' : ' · 大模型不可用（已降级为确定性映射）');
  box.appendChild(info);

  // 已识别
  const t1 = document.createElement('div');
  t1.innerHTML = '<div class="muted" style="margin-top:12px">已识别（点击可移除）</div>';
  const c1 = document.createElement('div');
  (m.detail||[]).forEach(d=>{
    const el = document.createElement('span');
    el.className = 'chip ' + (d.needsConfirmation ? 'warn' : 'ok') + ' clickable';
    el.innerHTML = d.label + ' <span class="muted">' + Math.round((d.confidence||0)*100) + '%</span> <span class="x">×</span>';
    el.onclick = ()=>{ mappingState.rejected.add(d.fragment); el.classList.add('hide'); };
    c1.appendChild(el);
  });
  if(!(m.detail||[]).length) c1.innerHTML = '<span class="muted">无</span>';
  t1.appendChild(c1); box.appendChild(t1);

  // 待确认
  if((m.ambiguous||[]).length){
    const t2 = document.createElement('div');
    t2.innerHTML = '<div class="muted" style="margin-top:12px">待确认（请选择最贴近的实例）</div>';
    (m.ambiguous||[]).forEach(a=>{
      const wrap = document.createElement('div');
      wrap.style.margin = '8px 0';
      const lab = document.createElement('div');
      lab.innerHTML = '<span class="badge">'+a.text+'</span>';
      wrap.appendChild(lab);
      const cd = document.createElement('div'); cd.className='cand';
      (a.candidates||[]).forEach(c=>{
        const b = document.createElement('button');
        b.textContent = c.label + ' (' + Math.round((c.score||0)*100) + '%)';
        b.onclick = ()=>{
          cd.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
          b.classList.add('sel');
          mappingState.chosen.set(a.text, c.fragment);
        };
        cd.appendChild(b);
      });
      wrap.appendChild(cd); t2.appendChild(wrap);
    });
    box.appendChild(t2);
  }

  // 未匹配
  if((m.unmatched||[]).length){
    const t3 = document.createElement('div');
    t3.innerHTML = '<div class="muted" style="margin-top:12px">未匹配（可忽略，或改写描述后重试）</div>';
    const c3 = document.createElement('div');
    (m.unmatched||[]).forEach(u=>{
      const el = document.createElement('span'); el.className='chip bad'; el.textContent = u; c3.appendChild(el);
    });
    t3.appendChild(c3); box.appendChild(t3);
  }

  document.getElementById('confirmCard').classList.remove('hide');
}

document.getElementById('btnConfirm').onclick = ()=>submitConfirm(true);
document.getElementById('btnRerun').onclick = ()=>submitConfirm(false);

async function submitConfirm(proceed){
  if(!currentKey || !mappingState) return;
  const confirmed = [];
  const rejected = Array.from(mappingState.rejected);
  const extra = [];
  mappingState.chosen.forEach((frag, text)=>{ if(frag) extra.push(frag); });
  (mappingState.detail||[]).forEach(d=>{
    if(!mappingState.rejected.has(d.fragment)) confirmed.push(d.fragment);
  });
  const btn = document.getElementById('btnConfirm');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>提交中…';
  try{
    const r = await fetch('/api/diagnosis/'+currentKey+'/confirm', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({confirmed, rejected, extra})});
    const j = await r.json();
    if(!r.ok){ msg('startMsg','err', j.error||'提交失败'); return; }
    handle(j);
  }catch(e){ msg('startMsg','err','请求失败：'+e); }
  finally{ btn.disabled=false; btn.textContent='确认并继续'; }
}

// ---------------- 结果 ----------------
function renderResult(j){
  const d = j.diagnosis || {};
  const m = j.mapping || {};
  const box = document.getElementById('resultBody');
  box.innerHTML = '';

  const grid = document.createElement('div'); grid.className='grid';
  grid.appendChild(kv('六经', d.sixChannelCn || '未定'));
  grid.appendChild(kv('方证', d.fangzhengCn || '未定'));
  grid.appendChild(kv('推荐方剂', d.finalFormulaCn || '未定', d.derived));
  grid.appendChild(kv('母方', d.baseFormulaCn || '—'));
  box.appendChild(grid);

  // 药物组成
  const h = document.createElement('div');
  h.innerHTML = '<div class="muted" style="margin-top:16px">药物组成</div>';
  const hb = document.createElement('div');
  const added = new Set(d.addedHerbCn||[]);
  const removed = new Set(d.removedHerbCn||[]);
  (d.herbsCn||[]).forEach(x=>{
    const s = document.createElement('span');
    s.className = 'herb' + (added.has(x)?' add':'');
    s.textContent = x; hb.appendChild(s);
  });
  removed.forEach(x=>{
    const s = document.createElement('span'); s.className='herb del'; s.textContent = x; hb.appendChild(s);
  });
  if(!(d.herbsCn||[]).length) hb.innerHTML = '<span class="muted">无</span>';
  h.appendChild(hb); box.appendChild(h);

  // 加减药明细
  const mod = document.createElement('div');
  mod.innerHTML = '<div class="muted" style="margin-top:16px">加减药（方后注）明细</div>';
  if(d.derived){
    const tb = document.createElement('table');
    tb.innerHTML = '<tr><th style="width:60%">命中规则</th><th>出处</th></tr>';
    const rules = d.appliedRules||[], srcs = d.ruleSources||[];
    rules.forEach((r,i)=>{
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>'+esc(r)+'</td><td>'+esc(srcs[i]||'—')+'</td>';
      tb.appendChild(tr);
    });
    mod.appendChild(tb);
    if((d.dosageChanges||[]).length){
      const dl = document.createElement('div'); dl.className='muted'; dl.style.marginTop='6px';
      dl.textContent = '剂量调整：' + d.dosageChanges.join('；');
      mod.appendChild(dl);
    }
  }else{
    const n = document.createElement('div'); n.className='muted';
    n.textContent = d.herbModificationSummary || '症状未超出母方标准证候，保持母方原组成';
    mod.appendChild(n);
  }
  box.appendChild(mod);

  // 警告
  if((d.warnings||[]).length){
    const w = document.createElement('div'); w.className='alert err';
    w.innerHTML = '<b>配伍禁忌警告</b><br>' + d.warnings.map(esc).join('<br>');
    box.appendChild(w);
  }

  // 解释
  if(d.explanation){
    const e = document.createElement('div'); e.className='explain'; e.textContent = d.explanation;
    box.appendChild(e);
  }

  // 映射明细
  if((m.detail||[]).length){
    const mp = document.createElement('div');
    mp.innerHTML = '<div class="muted" style="margin-top:16px">症状映射明细</div>';
    const tb = document.createElement('table');
    tb.innerHTML = '<tr><th>原表述</th><th>实例</th><th>类别</th><th>置信度</th><th>来源</th></tr>';
    (m.detail||[]).forEach(x=>{
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>'+esc(x.text)+'</td><td>'+esc(x.label)+'</td><td>'+esc(x.category)+'</td>'
                   + '<td>'+Math.round((x.confidence||0)*100)+'%</td><td>'+esc(x.source)+'</td>';
      tb.appendChild(tr);
    });
    mp.appendChild(tb); box.appendChild(mp);
  }

  document.getElementById('resultCard').classList.remove('hide');
}

function kv(k,v,hl){
  const d = document.createElement('div');
  d.className = 'kv' + (hl?' hl':'');
  d.innerHTML = '<div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div>';
  return d;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function msg(id, cls, text){
  const el = document.getElementById(id);
  if(el) el.innerHTML = '<div class="alert '+cls+'">'+esc(text)+'</div>';
}

// 初始化
renderSteps('symptom-mapping', new Set());
fetch('/api/diagnosis/health').then(r=>r.json()).then(j=>{
  if(!j.engineAvailable){
    msg('startMsg','warn','当前未连接 Camunda 引擎（camunda.client.* 未就绪），启动诊断将失败。症状目录已加载 '+j.catalogSize+' 个实例个体。');
  }else{
    msg('startMsg','info','引擎就绪 · 症状实例个体目录 '+j.catalogSize+' 项');
  }
}).catch(()=>{});
</script>
</body>
</html>
