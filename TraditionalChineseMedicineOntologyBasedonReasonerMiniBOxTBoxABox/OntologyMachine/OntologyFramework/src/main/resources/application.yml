# ==================== 应用基础配置 ====================
server:
  # 本 Worker 的 HTTP 端口（不要与 c8run 的 9080 冲突，建议使用 9081 或 9090）
  port: 9081

spring:
  application:
    name: pizza-ontology-worker

  # ==================== 数据源（MySQL，与 OBDA 映射匹配） ====================
  datasource:
    url: jdbc:mysql://localhost:3306/mypizzadb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: zj780704
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000

# ==================== Camunda 8 客户端（新配置，符合 8.9.x 标准） ====================
camunda:
  client:
    # 自管理模式（对应你的 c8run 本地环境）
    mode: self-managed
    # 认证方式：本地开发无需认证
    auth:
      type: none
    # 租户 ID（默认租户）
    tenant-ids:
      - <default>
    # ===== 连接地址（必须使用完整 URI） =====
    grpc-address: http://localhost:26500   # Zeebe Gateway gRPC 端口
    rest-address: http://localhost:9080    # Camunda Operate/Tasklist REST API 端口

    # ===== Worker 调优参数（可选，有默认值） =====
    worker:
      max-jobs-active: 32
      poll-interval: 100ms
      timeout: 300000          # 5 分钟，适配长任务
      threads: 32

# ==================== 本体服务自定义配置（供你的代码读取） ====================
ontology:
  #######################################################################
  #                         中医本体                                     #
  #######################################################################
  ##### OWL 本体文件路径
  #main-path: D:/work/Ontology/TraditionalChineseMedicineOntology/ontology/TCM.owl
  main-path: D:/work/Ontology/TraditionalChineseMedicineOntologyBasedonReasonerMiniBOxTBoxABox/ontology/tcm-all.owl
  #phase1-path: D:/work/Ontology/TraditionalChineseMedicineOntologyBasedonReasonerMiniBOxTBoxABox/ontology/tcm-phase1.owl
  ##### OBDA 映射文件路径（供 ObdaMappingParser 加载）
  obda-path: D:/work/Ontology/TraditionalChineseMedicineOntologyBasedonReasonerMiniBOxTBoxABox/ontology/database/fangji-yaowu.obda
  obda-properties-path: D:/work/Ontology/TraditionalChineseMedicineOntologyBasedonReasonerMiniBOxTBoxABox/ontology/database/fangji-yaowu.properties
  ####BPMN路径
  bpmn-path: D:/work/Ontology/TraditionalChineseMedicineOntologyBasedonReasonerMiniBOxTBoxABox/ontology/Jingfang_Diagnosis.bpmn
  ##### ABox 目录（症状/脉象/舌象实例个体目录来源）
  abox-dir: D:/work/Ontology/TraditionalChineseMedicineOntologyBasedonReasonerMiniBOxTBoxABox/ontology

  #######################################################################
  #                         pizza本体                                     #
  #######################################################################
  ##### OWL 本体文件路径
  #main-path: D:/work/Ontology/pizza-ontology/ontology/pizza-all-classes.owl
  ##### OBDA 映射文件路径（供 ObdaMappingParser 加载）
  #obda-path: D:/work/Ontology/pizza-ontology/ontology/database/myPizza.obda
  #obda-properties-path: D:/work/Ontology/pizza-ontology/ontology/database/myPizza.properties
  # 命名空间
  #type-ns: http://example.org/pizza/components/classes/
  #ind-ns: http://example.org/pizza/components/individuals/
  #target-top-class: http://example.org/pizza/components/classes/PizzaComponent
  #table-name: pizza_components

  # ===== Ontop 推理参数（由你代码中的 Ontop 配置读取） =====
  ontop:
    reasoning: true                      # 启用 TBox 推理
    query-rewriting: true                # 查询重写（推荐）
    enable-existential-reasoning: false  # 不处理 ∃ 量词（性能考虑）
    sql-generate-replace: true           # MySQL 使用 REPLACE()
    sparql-endpoint: http://localhost:8080/sparql   # 可选，暴露的 SPARQL 端点

# ==================== 大模型（OpenAI 兼容接口，用于症状语义映射） ====================
# 未配置 api-key 或 enabled=false 时自动降级为纯确定性映射（L1），应用仍可用。
llm:
  enabled: true
  base-url: https://api.openai.com/v1
  api-key: ${LLM_API_KEY:}
  model: gpt-4o-mini
  timeout-seconds: 20
  temperature: 0.0

# ==================== 症状实例个体映射（三层策略） ====================
symptom-mapping:
  top-k: 3                  # 每个表述单元保留的候选数
  accept-threshold: 0.85    # 置信度 ≥ 此值直接采纳，无需确认
  candidate-threshold: 0.50 # 置信度 ≥ 此值采纳但标记待确认；低于此值不采纳
  max-rounds: 3             # 人工确认回环上限，防止死循环
  llm-candidate-limit: 60   # 喂给大模型的白名单候选上限

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    # 调试本体服务
    com.ocean.openlletresolver: INFO
    com.ocean.ontopobdahandler: INFO
    uk.ac.manchester.cs.owlapi.modularity: WARN
    # Camunda 客户端日志
    io.camunda.zeebe.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"