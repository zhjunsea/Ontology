# 数据库连接
jdbc.url=jdbc:mysql://localhost:3306/tcmdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.user=root
jdbc.password=zj780704

# 本体文件（绝对路径或相对路径）
ontop.ontologyFile=D:/work/Ontology/TraditionalChineseMedicineOntology/ontology/TCM.owl
ontop.importOntologies=true

# 映射文件
mapping=tcm.obda

# 推理模式：NONE 表示不进行本体推理，完全依赖映射数据
reasoner=ontop

# SPARQL 端点端口
port=8080

# 连接池参数（可选，有默认值）
pool.maxSize=10
pool.minIdle=2
pool.connectionTimeout=5000
pool.idleTimeout=300000
pool.maxLifetime=600000

# SPARQL Endpoint（当 .obda 文件中未定义时的回退值）
sparql.endpoint=http://localhost:8080/sparql

# 控制Ontop的推理
ontop.reasoning=true
#控制 Ontop 在回答查询时是否利用 TBox（本体模式）中的公理（如 rdfs:subClassOf、owl:equivalentClass、属性链等）

ontop.queryRewriting=true
#true（查询重写）：在执行前，利用 TBox 公理将原始 SPARQL 改写为包含 UNION 等的扩展 SQL，然后交给数据库执行。这是虚拟映射的推荐模式。
#false（运行时推理）：查询保持原样，对每条返回的数据实时应用推理规则。类似传统描述逻辑推理机，ABox 大时性能极差。

ontop.enableExistentialReasoning=false
#作用：控制是否处理 OWL 中的存在量词约束（ObjectSomeValuesFrom，即 ∃R.C）

ontop.sql.generateReplace=true
#true：生成的 SQL 中使用标准 SQL 的 REPLACE() 函数。适用于 MySQL、MariaDB、PostgreSQL 等支持该函数的数据库。
#false（默认）：使用 TRANSLATE() 或其他数据库特定的字符串函数。适用于 Oracle、DB2 等不支持标准 REPLACE() 的数据库。
