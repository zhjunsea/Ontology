# ==================== 应用基础配置 ====================
server:
  # 本 Worker 的 HTTP 端口（不要与 c8run 的 9080 冲突，建议使用 9081 或 9090）
  port: 9082

spring:
  # Spring AI 默认自动配置在未配置 api-key 时会导致应用启动失败；
  # 本项目仅经 ChatAgent 按需自建模型，故关闭全部 OpenAI 模型自动配置（未配 key 也能启动、LLM 降级）。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      enabled: true
      base-url: ${LLM_BASE_URL:https://api.modelarts-maas.com/openai/v1}
      api-key: ${LLM_API_KEY:}
      # 外部 key 文件（纯文本，首行即 key）；仅当上方 api-key 为空时启用（yaml 直填优先）
      api-key-file: ${LLM_API_KEY_FILE:}
      timeout-seconds: ${LLM_TIMEOUT_SECONDS:300}
      chat:
        options:
          model: ${LLM_MODEL:DeepSeek-V4.1-Flash}
          temperature: 0.0
  application:
    name: ontology-framework-tcm

  # ==================== 数据源（MySQL，与 OBDA 映射匹配） ====================
  datasource:
    url: jdbc:mysql://localhost:${env-prepare.mysql.port:3306}/jingfangdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ''
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 600000

# ==================== Camunda 8 客户端（新配置，符合 8.9.x 标准） ====================
camunda:
  client:
    # 自管理模式（对应你的 c8run 本地环境）
    mode: self-managed
    # 认证方式：本地开发无需认证
    auth:
      type: none
    # 租户 ID（默认租户）
    tenant-ids:
      - <default>
    # ===== 连接地址（必须使用完整 URI） =====
    grpc-address: http://localhost:${env-prepare.camunda-grpc-port:26500}   # Zeebe Gateway gRPC 端口
    rest-address: http://localhost:${env-prepare.camunda-port:9080}    # Camunda Operate/Tasklist REST API 端口

    # ===== Worker 调优参数（可选，有默认值） =====
    worker:
      max-jobs-active: 32
      poll-interval: 100ms
      timeout: 300000          # 5 分钟，适配长任务
      threads: 32

# ==================== 本体服务自定义配置（供你的代码读取） ====================
ontology:
  #######################################################################
  #                         中医本体                                     #
  #######################################################################
  # 路径统一为相对路径，基准=模块根目录 OntologyFrameworkTCM/（本体资源已内聚至本模块 ontology/）
  ##### OWL 本体文件路径
  main-path: ontology/tcm-all.owl
  ##### ABox 查表本体路径（症状/舌象/脉象个体字典）
  # 不并入 TBox 入口：gettBoxOntology() 会合并所有已加载本体，ABox 混入会使
  # Openllet 分类对每个类做 ABox 一致性检查（988 个体 → CLASS_HIERARCHY 345s）。
  # 单独加载后分类 345s → 47s；诊断链路仍从此处查「症状个体 → 类」。
  abox-path: ontology/tcm-all-abox.owl
  ##### OBDA 映射文件路径（供 ObdaMappingParser 加载）
  obda-path: ontology/database/fangji-yaowu.obda
  obda-properties-path: ontology/database/fangji-yaowu.properties
  ####BPMN路径
  bpmn-path: ontology/bpmn/Jingfang_Diagnosis.bpmn
  ##### ABox 目录（症状/脉象/舌象实例个体目录来源）
  abox-dir: ontology

  # ===== Ontop 推理参数（由你代码中的 Ontop 配置读取） =====
  ontop:
    reasoning: true                      # 启用 TBox 推理
    query-rewriting: true                # 查询重写（推荐）
    enable-existential-reasoning: false  # 不处理 ∃ 量词（性能考虑）
    sql-generate-replace: true           # MySQL 使用 REPLACE()
    sparql-endpoint: http://localhost:${env-prepare.ontop-port:8080}/sparql   # 可选，暴露的 SPARQL 端点

# ==================== 环境准备（EnvPrepare）应用环境配置 ====================
# 「环境服务连接」（MySQL 连接默认值）已集中至 EnvPrepare 的 env.yaml
# （EnvPrepare/src/main/resources/env.yaml，由 com.ocean.envprepare.EnvConfig 读取并合并）。
# 软件安装位置（*-home）：本机开发环境已在此显式固定真实安装目录（应用值优先于通用配置）；同名项（叶子级）以本文件为准（应用覆盖通用）。
# 相对路径统一以模块根目录 OntologyFrameworkTCM/ 为基准；本体/映射/属性路径复用上方 ontology 节点，勿在此重复。
# 是否启用 MySQL 由是否声明本 env-prepare.mysql 节点决定；TCM 不依赖 RabbitMQ，故不声明 rabbitmq 节点、rabbitmq-home 留空。
env-prepare:
  # 软件安装位置：本机开发环境显式固定为实际安装目录；rabbitmq-home 留空（本应用不声明 RabbitMQ），
  # erlang-home 留空仍按 环境变量（ERLANG_HOME）→ 自动探测解析。
  # 分发时由安装器按实际安装目录注入绝对路径（与安装器模板 templates/application.yaml 同构）。
  # 本机实际 JDK：显式固定实际安装目录（与 Camunda/Ontop 运行 JDK 一致）
  java-home: 'C:\Program Files\Java\jdk-26.0.1'
  ontop-home: 'D:\work\Ontology\ontop-cli-5.5.0'
  camunda-home: 'D:\work\Ontology\c8run-8.9.6'
  rabbitmq-home: ''
  erlang-home: ''
  # 系统端口（多应用并行运行时按需修改以避免端口冲突；默认与单机惯例一致）
  # Ontop SPARQL endpoint 端口（启动 Ontop 时注入 --port，并回写 .properties 的 port/sparql.endpoint）
  ontop-port: 8080
  # Camunda（c8run）端口：主 REST 与 Zeebe 网关 gRPC
  camunda-port: 9080
  camunda-grpc-port: 26500
  # 目标数据库名（应用特有；MySQL 服务名/连接等通用项见 env.yaml）
  # 与 createdb_tables.ddl 的 CREATE DATABASE 保持一致
  mysql:
    db-name: jingfangdb
  # Ontop endpoint 使用的本体 XML catalog
  ontology-catalog: ontology/catalog-v001.xml
  # 建库建表 DDL（由 createdb 先执行）与数据灌入脚本（后执行）
  ddl-file: ontology/database/createdb_tables.ddl
  data-file: ontology/database/data.sql

# ==================== Openllet 推理器调优（第 3 级配置源） ====================
# 由 TCMOntologyJobWorker 注入后交给 OpenlletTuning 应用（在 BackendService 创建之前）。
# 优先级：OpenlletTuning 内置默认 < classpath openllet-tuning.properties < 本处 < -Dopenllet.tuning.*
# 留空（不写或写空串）则该级不生效，回落到上一级。
# 背景：TBox 含约 366 条 owl:equivalentClass 充要定义，Openllet 的 CD 优化分类路径
# 对其呈强非确定性耗时（15s ~ 数小时，偶发挂起）→ Worker 启动卡死。
# 实测关 CD + 关高级缓存后 precompute 中位数 18.7s（默认 84.7s），279 用例全过。
openllet:
  tuning:
    use-cd-classification: false    # 关 CD 优化分类器（非确定性耗时的直接来源）
    use-advanced-caching: false     # 关高级缓存（与关 CD 叠加后耗时收敛、方差最小）

# ==================== 大模型（OpenAI 兼容接口） ====================
# 已迁移至 spring.ai.openai.*（见文件顶部 spring.ai 块）；模型由 Utilities#ChatAgent 按需自建。

# ==================== 症状实例个体映射（三层策略） ====================
symptom-mapping:
  top-k: 3                  # 每个表述单元保留的候选数
  accept-threshold: 0.85    # 置信度 ≥ 此值直接采纳，无需确认
  candidate-threshold: 0.50 # 置信度 ≥ 此值采纳但标记待确认；低于此值不采纳
  max-rounds: 3             # 人工确认回环上限，防止死循环
  llm-candidate-limit: 60   # 喂给大模型的白名单候选上限
  llm-full-catalog-limit: 800 # 升级轮 / L4 兜底轮的全目录候选上限
  # ==================== L4：MCP 通道大模型兜底（仅处理 L1+L2 仍未匹配的表述） ====================
  # 经 MCP（Streamable HTTP）调用大模型做最终匹配；命中一律转「待确认」；
  # 不可用 / 超时 / 非法返回 → 回落为未匹配，绝不中断诊断流程。
  # 默认指向本应用内嵌的薄 MCP server（同 server.port，路径 /mcp；见 SymptomMatchMcpServerConfig）；
  # base-url/endpoint/tool/headers 均可改，指向任意符合「chat 工具：入参 {system,user}，返回模型文本」契约的外部 HTTP MCP server。
  mcp:
    enabled: true                             # 关闭则完全跳过 L4（保持既有 L1+L2 行为）
    base-url: http://localhost:${server.port} # 默认自连内嵌 server；改为外部 server 地址即可
    endpoint: /mcp                            # MCP 端点路径
    tool: chat                                # MCP 工具名
    # 需要的请求头默认无（留空即不带请求头）。切勿写成 "headers: {}"：空 flow map 会被
    # Spring 的 YAML 加载器展平为键 symptom-mapping.mcp.headers=""（空串），导致 Map 绑定失败。
    # 如需请求头，按下面展开的键值形式添加：
    # headers:
    #   Authorization: "Bearer xxx"

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    # 调试本体服务
    com.ocean.openlletresolver: INFO
    com.ocean.ontopobdahandler: INFO
    uk.ac.manchester.cs.owlapi.modularity: WARN
    # Camunda 客户端日志
    io.camunda.zeebe.client: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"