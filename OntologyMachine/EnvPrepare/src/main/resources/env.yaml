# ==================== 环境准备（EnvPrepare）通用环境配置 ====================
# 供 com.ocean.envprepare 的 EnvConfig 读取，集中存放「机器环境」（软件安装位置）与
# 「环境服务连接」（MySQL / RabbitMQ）的通用项，避免在各应用 application.yaml 中重复。
#   - 各应用 application.yaml 仅保留自身应用相关项；同名项（叶子级）以应用 application.yaml 为准。
#   - 是否启用 MySQL / RabbitMQ：由应用 application.yaml 是否声明对应的 env-prepare.mysql /
#     env-prepare.rabbitmq 节点决定；本文件仅提供连接默认值，不决定启用。
#   - 相对路径以「应用模块根目录」为基准解析。
env-prepare:
  # 软件安装位置（java-home / ontop-home / camunda-home / rabbitmq-home / erlang-home）不在此写死，
  # 按「实际安装环境」解析，优先级：
  #   ① 应用 application.yaml 的 env-prepare.*-home（分发时由安装器按实际安装目录注入）
  #   ② 环境变量：JAVA_HOME / ONTOP_HOME / CAMUNDA_HOME / RABBITMQ_HOME / ERLANG_HOME
  #   ③ 自动探测：JDK（当前 JVM 的 java.home）、Erlang（PATH 中的 bin\erl.exe 反推）
  # 如需固定某路径，在各应用 application.yaml 的 env-prepare 中显式配置对应 *-home 即可（应用覆盖通用）。

  # MySQL 连接（机器级通用默认；是否启用由应用 application.yaml 是否声明 env-prepare.mysql 决定）
  mysql:
    # 管理方式：service=Windows 服务（默认，本机安装）；portable=独立进程（随应用一起安装，用 mysqld --console 启停）
    # portable 时改由应用 application.yaml 覆盖 home / datadir / port 等，本处仅服务模式默认项。
    mode: service
    # MySQL Windows 服务名（service 模式下由 createdb/start 启动）
    service-name: MySQL80
    # mysql.exe 完整路径：不写死；留空则依次取 MYSQL_HOME 环境变量与 PATH 中的 mysql.exe
    bin: ''
    user: root
    password: ''

  # RabbitMQ 连接（机器级通用默认；是否启用由应用 application.yaml 是否声明 env-prepare.rabbitmq 决定）
  rabbitmq:
    host: localhost
    port: 5672
    management-port: 15672
    user: guest
    password: guest
    vhost: '/'
