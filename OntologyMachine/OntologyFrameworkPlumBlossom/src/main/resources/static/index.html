<body>

    <script>
        const NS = null;
        let pollTimer = null;
        let lastResult = null;
        let lastInputs = null;

        const CN = "[\\u4e00-\\u9fa5]";
        const CN_PATTERN = new RegExp("^" + CN + "+$");
        const SAMPLE_SUBJECT = "明日自东方出行求财，是否顺利？";
        const SAMPLE_CATEGORY = "出行";

        const METHOD_FIELDS = {

                { id: "direction", label: "物之方位", type: "select", required: true,

            ],

                { id: "windDirection", label: "风向（八方）", type: "select", required: true,
                  options: ["东","南","西","北","东南","西南","东北","西北"],
                  example: "东北", hint: "八方位之一" }
            ],
            "鸟占": [
                { id: "birdInfo", label: "鸟讯（只数+方所+鸣声+毛羽色+名义）", type: "text", required: true,
                  minLength: 2, maxLength: 200, example: "见二鸟自南方来，鸣声悲切，毛羽色白",
                  hint: "2~200 字" }
            ],
            "听声音占": [
                { id: "heardSound", label: "所闻之声（数量/方所/物声类别 + 悲喜）", type: "text", required: true,
                  minLength: 2, maxLength: 200, example: "静室中闻击木声三下，声悲",
                  hint: "2~200 字" }
            ],
            "形物占": [
                { id: "objectShape", label: "物形", type: "select", required: true,
                  options: ["圆","刚","方","柔","仰","覆","长","中刚外柔","内柔外刚","枯槁","文彩","破"],
                  example: "圆", hint: "十二物形之一" }
            ],
            "验色占": [
                { id: "objectColor", label: "物色", type: "select", required: true,
                  options: ["青","红紫赤","黄","白","黑"],
                  example: "青", hint: "五色之一" }

            "一撮金法": [
                { id: "yicuoText", label: "信手所写两字（楷书）", type: "text", required: true,
                  pattern: CN_PATTERN, exactLength: 2, example: "康节",
                  hint: "恰为 2 个汉字（上字内卦、下字外卦）" }
            ]
        };

        // ===== 农历换算（1900–2100，内置表；闰月沿用所闰之月的月数）=====
        const LUNAR_INFO = [
            0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
            0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
            0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
            0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
            0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
            0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,
            0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
            0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,
            0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
            0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
            0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
            0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
            0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
            0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
            0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,
            0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,
            0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,
            0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,
            0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,
            0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,
            0x0d520
        ];
        const ZHI = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];

        function lunarLeapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
        function lunarLeapDays(y) {
            if (lunarLeapMonth(y)) return (LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29;
            return 0;
        }
        function lunarMonthDays(y, m) {
            return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29;
        }
        function lunarYearDays(y) {
            let sum = 348;
            for (let i = 0x8000; i > 0x8; i >>= 1) {
                sum += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
            }
            return sum + lunarLeapDays(y);
        }

        /** 公历 Date → 农历 { year, month, day, isLeap }；闰月 month 沿用所闰之月的月数。 */
        function gregorianToLunar(date) {
            const offset = Math.round(
                (Date.UTC(date.getFullYear(), date.getMonth(), date.getDate())
                    - Date.UTC(1900, 0, 31)) / 86400000);
            let i, temp = 0, off = offset;
            for (i = 1900; i < 2101 && off > 0; i++) {
                temp = lunarYearDays(i);
                off -= temp;
            }
            if (off < 0) { off += temp; i--; }
            const year = i;
            const leap = lunarLeapMonth(year);
            let isLeap = false;
            for (i = 1; i < 13 && off > 0; i++) {
                if (leap > 0 && i === leap + 1 && !isLeap) {
                    --i; isLeap = true; temp = lunarLeapDays(year);
                } else {
                    temp = lunarMonthDays(year, i);
                }
                if (isLeap && i === leap + 1) isLeap = false;
                off -= temp;
            }
            if (off === 0 && leap > 0 && i === leap + 1) {
                if (isLeap) { isLeap = false; } else { isLeap = true; --i; }
            }
            if (off < 0) { off += temp; --i; }
            return { year: year, month: i, day: off + 1, isLeap: isLeap };
        }

        /** 当前时刻 → 时辰地支（23:00~00:59 为子，依此类推）。 */
        function currentHourZhi(date) {
            return ZHI[Math.floor(((date.getHours() + 1) % 24) / 2)];
        }

        function hintText(f) {
            let t = "范围：" + f.hint;
            if (f.example !== undefined) t += " ｜ 样例：" + f.example;
            return t;
        }

        function renderMethodFields() {
            const method = document.getElementById("divinationMethod").value;
            const container = document.getElementById("methodFields");
            container.innerHTML = "";
            clearError("err_divinationMethod");
            clearError("err_method");
            const fields = METHOD_FIELDS[method];
            if (!fields) return;
            fields.forEach(f => {
                const label = document.createElement("label");
                label.textContent = f.label + (f.required ? " *" : "");
                container.appendChild(label);
                let input;
                if (f.type === "select") {
                    input = document.createElement("select");
                    const opt0 = document.createElement("option");
                    opt0.value = ""; opt0.textContent = "— 请选择 —";
                    input.appendChild(opt0);
                    f.options.forEach(o => {
                        const opt = document.createElement("option");
                        opt.value = o; opt.textContent = o;
                        input.appendChild(opt);
                    });
                } else {
                    input = document.createElement("input");
                    input.type = f.type;
                    if (f.type === "number") {
                        if (f.min !== undefined) input.min = f.min;
                        if (f.max !== undefined) input.max = f.max;
                        if (f.int) input.step = 1;
                    }
                    if (f.maxLength !== undefined) input.maxLength = f.maxLength;
                    if (f.example !== undefined) input.placeholder = "样例：" + f.example;
                }
                input.id = "field_" + f.id;
                input.dataset.fieldId = f.id;
                input.addEventListener("input", () => validateOne(f));
                input.addEventListener("change", () => validateOne(f));
                input.addEventListener("blur", () => validateOne(f));
                container.appendChild(input);

                const hint = document.createElement("div");
                hint.className = "hint";
                hint.textContent = hintText(f);
                container.appendChild(hint);

                const err = document.createElement("div");
                err.className = "field-error";

        /** 「年月日时起例」：按当前公历日期/时刻换算农历年、月、日与时辰，预填为缺省值，用户可自行修改。 */
        function prefillCurrentDateTime(container) {
            const now = new Date();
            // 农历以子时（23:00）为一日之始：23:00~23:59 已入次日子时，故换算农历日时日期进一日（而非等到 24:00）。
            const lunarBase = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            if (now.getHours() >= 23) {
                lunarBase.setDate(lunarBase.getDate() + 1);
            }
            const lunar = gregorianToLunar(lunarBase);
            const setVal = (id, v) => {
                const el = document.getElementById("field_" + id);
                if (el) el.value = String(v);
            };
            setVal("lunarYear", lunar.year);
            setVal("lunarMonth", lunar.month);
            setVal("lunarDay", lunar.day);
            setVal("hourZhi", currentHourZhi(now));
            const note = document.createElement("div");
            note.className = "hint";
            note.textContent = "已按当前日期/时刻换算为农历年月日与时辰并预填（缺省值），可自行修改。";
            container.appendChild(note);
        }

        function fieldError(f, rawValue) {
            const val = (rawValue === undefined || rawValue === null) ? "" : String(rawValue).trim();
            if (val === "") return f.required ? "此项必填，请勿留空" : null;
            if (f.type === "number") {
                if (!/^-?\d+$/.test(val)) return "请输入整数";
                const n = Number(val);
                if (f.min !== undefined && n < f.min) return "数值不得小于 " + f.min;
                if (f.max !== undefined && n > f.max) return "数值不得大于 " + f.max;
            }
            if (f.exactLength !== undefined && val.length !== f.exactLength) {
                return "须恰为 " + f.exactLength + " 个字（当前 " + val.length + " 个）";
            }
            if (f.minLength !== undefined && val.length < f.minLength) {
                return "不得少于 " + f.minLength + " 个字（当前 " + val.length + " 个）";
            }
            if (f.maxLength !== undefined && val.length > f.maxLength) {
                return "不得超过 " + f.maxLength + " 个字（当前 " + val.length + " 个）";
            }
            if (f.pattern && !f.pattern.test(val)) return "仅限汉字，请勿含数字/字母/符号";
            return null;
        }

        function validateAllInputs() {
            let ok = true;

            if (!method) {

            } else {
                clearError("err_preceptPromise");

                if (target && target.focus) target.focus();

        async function startDivination() {
            const resultDiv = document.getElementById("result");
            const btn = document.getElementById("startBtn");

            if (!validateAllInputs()) {
                resultDiv.innerHTML = '<span class="status-error">❌ 输入校验未通过，请按各字段红字提示修正后再提交</span>';

            btn.disabled = true;
            resultDiv.innerHTML = '<span class="status-running">正在启动占断流程...</span>\n占断事项: ' + vars.subject;

            try {
                const response = await fetch("/api/plumblossom/divination", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(vars)
                });
                const data = await response.json();

                    resultDiv.innerHTML =

                    btn.disabled = false;

                resultDiv.innerHTML = '<span class="status-error">❌ 请求异常: ' + e.message + '</span>';
                btn.disabled = false;
            }
        }

        function pollStatus(instanceKey, subject) {
            const resultDiv = document.getElementById("result");
            const btn = document.getElementById("startBtn");
            let count = 0;

            pollTimer = setInterval(async () => {
                count++;
                try {
                    const resp = await fetch("/api/plumblossom/divination/" + instanceKey);
                    const data = await resp.json();
                    const status = data.status;

                    if (status === "COMPLETED") {
                        clearInterval(pollTimer); pollTimer = null;
                        btn.disabled = false;
                        lastResult = { vars: data.variables || {}, subject: subject, instanceKey: instanceKey };
                        resultDiv.innerHTML = renderCompleted(data, subject, instanceKey);
                    } else if (status === "INCIDENT" || status === "TERMINATED") {
                        clearInterval(pollTimer); pollTimer = null;
                        btn.disabled = false;
                        resultDiv.innerHTML =
                            '占断事项: ' + subject + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-error">流程状态: ' + status + ' ❌ 流程异常终止</span>';
                    } else {
                        resultDiv.innerHTML =
                            '✅ 占断流程已启动\n' +
                            '占断事项: ' + subject + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-running">流程状态: RUNNING (轮询 #' + count + ')</span>';
                    }
                } catch (e) {
                    resultDiv.innerHTML = '<span class="status-error">❌ 轮询异常: ' + e.message + '</span>';
                }
            }, 1000);
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function inlineMd(s) {
            s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
            s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
            s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
            return s;
        }

        function renderMarkdown(raw) {
            if (!raw) return '';
            const lines = String(raw).replace(/\r\n?/g, '\n').split('\n');
            let html = '';
            let para = [];
            let listType = null;
            let inCode = false;
            const flushPara = () => {
                if (para.length) {
                    html += '<p>' + inlineMd(escapeHtml(para.join(' '))) + '</p>';
                    para = [];
                }
            };
            const closeList = () => {
                if (listType) { html += '</' + listType + '>'; listType = null; }
            };
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                const t = line.trim();

                if (/^```/.test(t)) {
                    flushPara(); closeList();
                    if (!inCode) { html += '<pre><code>'; inCode = true; }
                    else { html += '</code></pre>'; inCode = false; }
                    continue;
                }
                if (inCode) { html += escapeHtml(line) + '\n'; continue; }

                if (t === '') { flushPara(); closeList(); continue; }

                let m = /^(#{1,6})\s+(.*)$/.exec(t);
                if (m) {
                    flushPara(); closeList();
                    const lv = Math.min(m[1].length + 2, 6);
                    html += '<h' + lv + '>' + inlineMd(escapeHtml(m[2])) + '</h' + lv + '>';
                    continue;
                }
                if (/^(?:-{3,}|\*{3,}|_{3,})$/.test(t)) {
                    flushPara(); closeList(); html += '<hr>'; continue;
                }
                if (/^>\s?/.test(t)) {
                    flushPara(); closeList();
                    html += '<blockquote>' + inlineMd(escapeHtml(t.replace(/^>\s?/, ''))) + '</blockquote>';
                    continue;
                }
                m = /^[-*+]\s+(.*)$/.exec(t);
                if (m) {
                    flushPara();
                    if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
                    html += '<li>' + inlineMd(escapeHtml(m[1])) + '</li>';
                    continue;
                }
                m = /^\d+[.)]\s+(.*)$/.exec(t);
                if (m) {
                    flushPara();
                    if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
                    html += '<li>' + inlineMd(escapeHtml(m[1])) + '</li>';
                    continue;
                }

                closeList();
                para.push(t);
            }
            flushPara();
            closeList();
            return html;
        }

        function nowStamp() {
            const d = new Date();

        /** 依占断变量、输入与实例信息生成完整的 Markdown 文档文本。 */

                L.push('### 占断结论');
                L.push('');
                L.push(stripHtml(vars.divinationResult));
                L.push('');
            }

            if (has(vars.originalHexagramDictumText) || has(vars.movingLineDictumText)) {
                L.push('## 周易经传（本卦卦辞 · 动爻爻辞）');
                L.push('');
                if (has(vars.originalHexagramDictumText)) {
                    L.push('### 本卦卦辞原文');
                    L.push('');
                    L.push(stripHtml(vars.originalHexagramDictumText));
                    L.push('');
                    if (has(vars.originalHexagramDictumInterpretation)) {
                        L.push('> 解释（彖传·大象传）：' + stripHtml(vars.originalHexagramDictumInterpretation));
                        L.push('');
                    }
                }
                if (has(vars.movingLineDictumText)) {
                    L.push('### 动爻爻辞原文');
                    L.push('');
                    L.push(stripHtml(vars.movingLineDictumText));
                    L.push('');
                    if (has(vars.movingLineDictumInterpretation)) {
                        L.push('> 解释（小象传）：' + stripHtml(vars.movingLineDictumInterpretation));
                        L.push('');
                    }
                }
            }

            if (has(vars.aiInterpretation)) {
                L.push('## 邵康节解读（大模型依《梅花易数》原著解析）');
                L.push('');
                L.push(String(vars.aiInterpretation));
                L.push('');
            }

            if (has(vars.aiInterpretationPlain)) {
                L.push('## 白话文解释');
                L.push('');
                L.push(String(vars.aiInterpretationPlain));
                L.push('');
            }

            return L.join('\n');
        }

        /** 将当前占断的全部结果导出为格式化 Markdown 文件并触发下载。 */
        function downloadResultMarkdown() {
            if (!lastResult) return;
            const md = buildResultMarkdown(lastResult.vars, lastResult.subject, lastResult.instanceKey, lastInputs);
            const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '梅花易数占断_' + safeFileName(lastResult.subject) + '_' +
                nowStamp().replace(/[:\s]/g, '-') + '.md';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function renderCompleted(data, subject, instanceKey) {
            const vars = data.variables || {};
            let html = '占断事项: ' + subject + '\n' +
                '流程实例Key: ' + instanceKey + '\n' +
                '<span class="status-completed">流程状态: COMPLETED ✅ 流程已结束</span>\n';

            if (vars.alertText) {
                html += '<div class="result-section">' +
                    '<div><span class="result-label">戒律告警:</span> <span class="result-value">' + vars.alertText + '</span></div>' +
                    (vars.triggeredPrecept ? '<div><span class="result-label">触发条目:</span> <span class="result-value">' + vars.triggeredPrecept + '</span></div>' : '') +
                    '</div>';
                html += downloadButtonHtml();
                return html;
            }

            const steps = buildSteps(vars);

            html += '<div class="result-section">';
            html += '<div class="step-title">推演过程（依原著逐步骤推导）</div>';
            steps.forEach(st => {
                if (!has(st.value)) return;
                html += '<div class="step">' +
                    '<div class="step-title">' + st.title + '</div>' +
                    '<div class="step-value">' + st.value + '</div>' +
                    '<div class="step-note">依据：' + st.note + '</div>' +
                    '</div>';
            });
            if (has(vars.divinationResult)) {
                html += '<div class="step"><div class="step-title">占断结论</div><div class="step-value">' + vars.divinationResult + '</div></div>';
            }
            html += '</div>';

            if (has(vars.originalHexagramDictumText) || has(vars.movingLineDictumText)) {
                html += '<div class="result-section">';
                html += '<div class="step-title">周易经传（本卦卦辞 · 动爻爻辞）</div>';
                if (has(vars.originalHexagramDictumText)) {
                    html += '<div class="step">' +
                        '<div class="step-title">本卦卦辞原文</div>' +
                        '<div class="step-value">' + vars.originalHexagramDictumText + '</div>' +
                        (has(vars.originalHexagramDictumInterpretation) ? '<div class="step-note">解释（彖传·大象传）：' + vars.originalHexagramDictumInterpretation + '</div>' : '') +
                        '</div>';
                }
                if (has(vars.movingLineDictumText)) {
                    html += '<div class="step">' +
                        '<div class="step-title">动爻爻辞原文</div>' +
                        '<div class="step-value">' + vars.movingLineDictumText + '</div>' +
                        (has(vars.movingLineDictumInterpretation) ? '<div class="step-note">解释（小象传）：' + vars.movingLineDictumInterpretation + '</div>' : '') +
                        '</div>';
                }
                html += '</div>';
            }

            if (has(vars.aiInterpretation)) {
                html += '<div class="result-section">';
                html += '<div class="step-title">邵康节解读（大模型依《梅花易数》原著解析）</div>';
                html += '<div class="markdown-body">' + renderMarkdown(vars.aiInterpretation) + '</div>';
                html += '</div>';
            }

            if (has(vars.aiInterpretationPlain)) {
                html += '<div class="result-section">';
                html += '<div class="step-title">白话文解释（通俗讲解上节邵康节解读）</div>';
                html += '<div class="markdown-body">' + renderMarkdown(vars.aiInterpretationPlain) + '</div>';
                html += '</div>';
            }

            html += downloadButtonHtml();
            return html;
        }

        document.getElementById("subject").addEventListener("input", validateSubject);
        document.getElementById("subject").addEventListener("blur", validateSubject);
        document.getElementById("preceptPromise").addEventListener("change", () => {
            if (document.getElementById("preceptPromise").checked) clearError("err_preceptPromise");
        });

        fetch("/api/plumblossom/health").then(r => r.json()).then(d => {
            const info = document.querySelector(".status-info");
            info.textContent += " | 引擎状态: " + (d.engineAvailable ? "✅" : "❌");
        }).catch(() => {});
    </script>
</body>
</html>
