<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本体应用框架示例 - 披萨烘焙流程</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 { color: #333; text-align: center; }
        .pizza-selection {
            display: flex; justify-content: center; gap: 20px; margin: 30px 0;
        }
        .pizza-btn {
            padding: 15px 30px; font-size: 16px;
            border: 2px solid #4CAF50; border-radius: 8px;
            background-color: white; color: #4CAF50;
            cursor: pointer; transition: all 0.3s;
        }
        .pizza-btn:hover { background-color: #4CAF50; color: white; }
        .pizza-btn:disabled {
            border-color: #ccc; color: #ccc; cursor: not-allowed; background-color: #f9f9f9;
        }
        #result {
            margin-top: 30px; padding: 20px;
            border: 1px solid #ddd; border-radius: 8px;
            background-color: white; min-height: 100px;
            white-space: pre-wrap; font-family: monospace;
        }
        .status-info {
            color: #666; font-size: 14px; text-align: center; margin-top: 10px;
        }
        .status-running { color: #FF9800; font-weight: bold; }
        .status-completed { color: #4CAF50; font-weight: bold; }
        .status-error { color: #f44336; font-weight: bold; }
        .result-section {
            margin-top: 15px; padding: 10px;
            border-left: 3px solid #4CAF50; background-color: #f9fff9;
        }
        .result-label { color: #666; font-size: 13px; }
        .result-value { color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <h1>本体应用框架示例 - 披萨烘焙流程</h1>
    <p class="status-info">选择披萨类型，启动 Camunda BPMN 烘焙流程</p>
    <div class="pizza-selection">
        <button class="pizza-btn" onclick="startBaking('ItalianStyleWhiteSeafoodPizza')">ItalianStyleWhiteSeafoodPizza</button>
        <button class="pizza-btn" onclick="startBaking('MargheritaPizza')">MargheritaPizza</button>
        <button class="pizza-btn" onclick="startBaking('VegetarianPizza')">VegetarianPizza</button>
    </div>
    <div id="result">等待操作...</div>

    <script>
        const PIZZA_NS = "http://example.org/pizza/core/";
        let pollTimer = null;

        async function startBaking(pizzaType) {
            const fullIri = PIZZA_NS + pizzaType;
            const resultDiv = document.getElementById("result");
            const buttons = document.querySelectorAll(".pizza-btn");

            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            buttons.forEach(b => b.disabled = true);
            resultDiv.innerHTML = '<span class="status-running">正在启动烘焙流程...</span>\n披萨类型: ' + fullIri;

            try {
                const response = await fetch("/api/example/baking", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ pizzaType: fullIri })
                });
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML =
                        '✅ 烘焙流程已启动\n' +
                        '披萨类型: ' + fullIri + '\n' +
                        '流程实例Key: ' + data.instanceKey + '\n' +
                        '<span class="status-running">流程状态: RUNNING</span>';
                    pollStatus(data.instanceKey, fullIri);
                } else {
                    resultDiv.innerHTML = '<span class="status-error">❌ 启动失败: ' + (data.error || "未知错误") + '</span>';
                    buttons.forEach(b => b.disabled = false);
                }
            } catch (e) {
                resultDiv.innerHTML = '<span class="status-error">❌ 请求异常: ' + e.message + '</span>';
                buttons.forEach(b => b.disabled = false);
            }
        }

        function pollStatus(instanceKey, pizzaType) {
            const resultDiv = document.getElementById("result");
            const buttons = document.querySelectorAll(".pizza-btn");
            let count = 0;

            pollTimer = setInterval(async () => {
                count++;
                try {
                    const resp = await fetch("/api/example/baking/" + instanceKey);
                    const data = await resp.json();
                    const status = data.status;

                    if (status === "COMPLETED") {
                        clearInterval(pollTimer); pollTimer = null;
                        buttons.forEach(b => b.disabled = false);

                        let html = '✅ 烘焙流程已启动\n' +
                            '披萨类型: ' + pizzaType + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-completed">流程状态: COMPLETED ✅ 流程已结束</span>\n' +
                            '<div class="result-section">';

                        if (data.pizzaSummary) {
                            html += '<div><span class="result-label">披萨摘要:</span>\n<span class="result-value">' + data.pizzaSummary + '</span></div>';
                        }
                        if (data.myPizzaInstanceIri) {
                            html += '<div><span class="result-label">实例IRI:</span> <span class="result-value">' + data.myPizzaInstanceIri + '</span></div>';
                        }
                        if (data.ontologyValidationStatus) {
                            html += '<div><span class="result-label">本体验证:</span> <span class="result-value">' + data.ontologyValidationStatus + '</span></div>';
                        }

                        const vars = data.variables || {};
                        const components = [];
                        for (const [k, v] of Object.entries(vars)) {
                            if (k.startsWith("selected") || k.startsWith("component") || k === "matchedWord") {
                                components.push(k + " = " + v);
                            }
                        }
                        if (components.length > 0) {
                            html += '<div><span class="result-label">流程变量:</span>\n' + components.join("\n") + '</div>';
                        }
                        html += '</div>';

                        resultDiv.innerHTML = html;
                    } else if (status === "INCIDENT" || status === "TERMINATED") {
                        clearInterval(pollTimer); pollTimer = null;
                        buttons.forEach(b => b.disabled = false);
                        resultDiv.innerHTML =
                            '披萨类型: ' + pizzaType + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-error">流程状态: ' + status + ' ❌ 流程异常终止</span>';
                    } else {
                        resultDiv.innerHTML =
                            '✅ 烘焙流程已启动\n' +
                            '披萨类型: ' + pizzaType + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-running">流程状态: RUNNING (轮询 #' + count + ')</span>';
                    }
                } catch (e) {
                    resultDiv.innerHTML = '<span class="status-error">❌ 轮询异常: ' + e.message + '</span>';
                }
            }, 1000);
        }

        fetch("/api/example/health").then(r => r.json()).then(d => {
            const info = document.querySelector(".status-info");
            info.textContent += " | 引擎状态: " + (d.engineAvailable ? "✅" : "❌");
        }).catch(() => {});
    </script>
</body>
</html>
