<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新能源行业 IT 空间与云空间洞察（NEInsight）</title>
    <style>
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            max-width: 860px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 { color: #333; text-align: center; font-size: 22px; }
        .domain-selection {
            display: flex; justify-content: center; gap: 20px; margin: 30px 0;
        }
        .domain-btn {
            padding: 15px 30px; font-size: 16px;
            border: 2px solid #1677ff; border-radius: 8px;
            background-color: white; color: #1677ff;
            cursor: pointer; transition: all 0.3s;
        }
        .domain-btn:hover { background-color: #1677ff; color: white; }
        .domain-btn:disabled {
            border-color: #ccc; color: #ccc; cursor: not-allowed; background-color: #f9f9f9;
        }
        #result {
            margin-top: 30px; padding: 20px;
            border: 1px solid #ddd; border-radius: 8px;
            background-color: white; min-height: 100px;
            white-space: pre-wrap; font-family: monospace;
        }
        .status-info {
            color: #666; font-size: 14px; text-align: center; margin-top: 10px;
        }
        .status-running { color: #FF9800; font-weight: bold; }
        .status-completed { color: #4CAF50; font-weight: bold; }
        .status-error { color: #f44336; font-weight: bold; }
        .result-section {
            margin-top: 15px; padding: 10px;
            border-left: 3px solid #1677ff; background-color: #f9fbff;
        }
        .result-label { color: #666; font-size: 13px; }
        .result-value { color: #333; font-weight: bold; }
    </style>
</head>
<body>
    <h1>新能源行业 IT 空间与云空间洞察（NEInsight）</h1>
    <p class="status-info">选择洞察域，启动「五看三定」Camunda BPMN 洞察流程</p>
    <div class="domain-selection">
        <button class="domain-btn" onclick="startInsight('IT_SPACE')">IT 空间</button>
        <button class="domain-btn" onclick="startInsight('CLOUD_SPACE')">云空间</button>
        <button class="domain-btn" onclick="startInsight('COMBINED')">联合</button>
    </div>
    <div id="result">等待操作...</div>

    <script>
        let pollTimer = null;

        async function startInsight(insightDomain) {
            const resultDiv = document.getElementById("result");
            const buttons = document.querySelectorAll(".domain-btn");

            if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
            buttons.forEach(b => b.disabled = true);
            resultDiv.innerHTML = '<span class="status-running">正在启动洞察流程...</span>\n洞察域: ' + insightDomain;

            try {
                const response = await fetch("/api/neinsight/insight", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ insightDomain: insightDomain })
                });
                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML =
                        '✅ 洞察流程已启动\n' +
                        '洞察域: ' + insightDomain + '\n' +
                        '流程实例Key: ' + data.instanceKey + '\n' +
                        '<span class="status-running">流程状态: RUNNING</span>';
                    pollStatus(data.instanceKey, insightDomain);
                } else {
                    resultDiv.innerHTML = '<span class="status-error">❌ 启动失败: ' + (data.error || "未知错误") + '</span>';
                    buttons.forEach(b => b.disabled = false);
                }
            } catch (e) {
                resultDiv.innerHTML = '<span class="status-error">❌ 请求异常: ' + e.message + '</span>';
                buttons.forEach(b => b.disabled = false);
            }
        }

        function pollStatus(instanceKey, insightDomain) {
            const resultDiv = document.getElementById("result");
            const buttons = document.querySelectorAll(".domain-btn");
            let count = 0;

            pollTimer = setInterval(async () => {
                count++;
                try {
                    const resp = await fetch("/api/neinsight/insight/" + instanceKey);
                    const data = await resp.json();
                    const status = data.status;

                    if (status === "COMPLETED") {
                        clearInterval(pollTimer); pollTimer = null;
                        buttons.forEach(b => b.disabled = false);

                        let html = '✅ 洞察流程已启动\n' +
                            '洞察域: ' + insightDomain + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-completed">流程状态: COMPLETED ✅ 流程已结束</span>\n' +
                            '<div class="result-section">';

                        if (data.insightSummary) {
                            html += '<div><span class="result-label">洞察摘要:</span>\n<span class="result-value">' + data.insightSummary + '</span></div>';
                        }
                        if (data.instanceIri) {
                            html += '<div><span class="result-label">实例IRI:</span> <span class="result-value">' + data.instanceIri + '</span></div>';
                        }
                        if (data.ontologyValidationStatus) {
                            html += '<div><span class="result-label">本体验证:</span> <span class="result-value">' + data.ontologyValidationStatus + '</span></div>';
                        }
                        if (data.insightSkillPath) {
                            html += '<div><span class="result-label">洞察 SKILL 路径:</span> <span class="result-value">' + data.insightSkillPath + '</span></div>';
                        }

                        const vars = data.variables || {};
                        const interested = [];
                        for (const [k, v] of Object.entries(vars)) {
                            if (k.endsWith("Result") || k === "opportunityPriority" || k === "smartCompliant" || k === "alertDispatched") {
                                interested.push(k + " = " + v);
                            }
                        }
                        if (interested.length > 0) {
                            html += '<div><span class="result-label">流程变量:</span>\n' + interested.join("\n") + '</div>';
                        }
                        html += '</div>';

                        resultDiv.innerHTML = html;
                    } else if (status === "INCIDENT" || status === "TERMINATED") {
                        clearInterval(pollTimer); pollTimer = null;
                        buttons.forEach(b => b.disabled = false);
                        resultDiv.innerHTML =
                            '洞察域: ' + insightDomain + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-error">流程状态: ' + status + ' ❌ 流程异常终止</span>';
                    } else {
                        resultDiv.innerHTML =
                            '✅ 洞察流程已启动\n' +
                            '洞察域: ' + insightDomain + '\n' +
                            '流程实例Key: ' + instanceKey + '\n' +
                            '<span class="status-running">流程状态: RUNNING (轮询 #' + count + ')</span>';
                    }
                } catch (e) {
                    resultDiv.innerHTML = '<span class="status-error">❌ 轮询异常: ' + e.message + '</span>';
                }
            }, 1000);
        }

        fetch("/api/neinsight/health").then(r => r.json()).then(d => {
            const info = document.querySelector(".status-info");
            info.textContent += " | 引擎状态: " + (d.engineAvailable ? "✅" : "❌");
        }).catch(() => {});
    </script>
</body>
</html>
