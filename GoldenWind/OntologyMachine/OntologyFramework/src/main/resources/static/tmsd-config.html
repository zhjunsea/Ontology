<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔架中段设计 · 配置录入</title>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --line: #e3e8ef;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --ok-bg: #ecfdf5;
            --ok-text: #047857;
            --err-bg: #fef2f2;
            --err-text: #b91c1c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .wrap { max-width: 860px; margin: 0 auto; }
        header { margin-bottom: 20px; }
        h1 { font-size: 20px; margin: 0 0 6px; }
        .sub { color: var(--muted); font-size: 13px; line-height: 1.6; }
        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 22px 24px;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }
        .row { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .key { color: var(--muted); font-weight: 400; font-size: 12px; }
        input[type="text"] {
            width: 100%;
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: 7px;
            font-size: 13px;
            color: var(--text);
            background: #fff;
            font-family: Consolas, "Courier New", monospace;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
        }
        .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
        .actions { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
        button {
            border: none;
            border-radius: 7px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            cursor: pointer;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { opacity: .6; cursor: not-allowed; }
        button.ghost {
            background: #fff; color: var(--text); border: 1px solid var(--line);
        }
        .banner {
            display: none;
            margin-bottom: 16px;
            padding: 11px 14px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .banner.ok { display: block; background: var(--ok-bg); color: var(--ok-text); }
        .banner.err { display: block; background: var(--err-bg); color: var(--err-text); }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>塔架中段设计 · 配置录入</h1>
        <div class="sub">
            修改后保存将写回 <code>application.yaml</code>，<strong>重启应用后生效</strong>。
            缺省值即为当前配置值。
        </div>
    </header>

    <div class="card">
        <div id="banner" class="banner"></div>
        <form id="form" autocomplete="off">
            <div class="row">
                <label>本体文件路径 <span class="key">ontology.main-path</span></label>
                <input type="text" id="ontologyMainPath" required>
            </div>
            <div class="row">
                <label>BPMN 流程路径 <span class="key">ontology.bpmn-path</span></label>
                <input type="text" id="ontologyBpmnPath" required>
            </div>
            <div class="row">
                <label>塔架几何输入 <span class="key">tmsd.historical-geo-path</span></label>
                <input type="text" id="historicalGeoPath" required>
                <div class="hint">历史设计样本：含 Description / TowerGeo / Flange / Door / V-Flange 等 sheet 的 Excel。</div>
            </div>
            <div class="row">
                <label>项目布局表 <span class="key">tmsd.historical-layout-path</span></label>
                <input type="text" id="historicalLayoutPath" required>
                <div class="hint">下段 / 中间段 / 顶段 三段布局的 Excel。</div>
            </div>
            <div class="row">
                <label>输出目录 <span class="key">tmsd.output-dir</span></label>
                <input type="text" id="outputDir" required>
                <div class="hint">写出「需修改的模型参数及值」txt 与对比报告的目录。</div>
            </div>
            <div class="actions">
                <button type="submit" id="saveBtn">保存</button>
                <button type="button" class="ghost" id="reloadBtn">重新载入当前值</button>
            </div>
        </form>
    </div>
</div>

<script>
    const FIELDS = [
        "ontologyMainPath",
        "ontologyBpmnPath",
        "historicalGeoPath",
        "historicalLayoutPath",
        "outputDir"
    ];

    const banner = document.getElementById("banner");
    const form = document.getElementById("form");
    const saveBtn = document.getElementById("saveBtn");
    const reloadBtn = document.getElementById("reloadBtn");
    const API = "/api/tmsd/config";

    function show(kind, text) {
        banner.className = "banner " + kind;
        banner.textContent = text;
    }

    function hideBanner() {
        banner.className = "banner";
        banner.textContent = "";
    }

    async function load() {
        hideBanner();
        try {
            const res = await fetch(API, { headers: { "Accept": "application/json" } });
            if (!res.ok) throw new Error("HTTP " + res.status);
            const data = await res.json();
            FIELDS.forEach(f => {
                document.getElementById(f).value = data[f] == null ? "" : data[f];
            });
        } catch (e) {
            show("err", "读取当前配置失败：" + e.message);
        }
    }

    async function save() {
        hideBanner();
        const body = {};
        FIELDS.forEach(f => { body[f] = document.getElementById(f).value.trim(); });

        saveBtn.disabled = true;
        saveBtn.textContent = "保存中…";
        try {
            const res = await fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            const data = await res.json().catch(() => ({}));
            if (res.ok && data.success) {
                show("ok", data.message || "保存成功。");
            } else {
                show("err", (data && data.message) ? data.message : ("保存失败：HTTP " + res.status));
            }
        } catch (e) {
            show("err", "保存失败：" + e.message);
        } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "保存";
        }
    }

    form.addEventListener("submit", e => { e.preventDefault(); save(); });
    reloadBtn.addEventListener("click", load);
    load();
</script>
</body>
</html>
