# ==================== TMSD 专属配置（profile: TMSDBPMN） ====================
# 仅当 TMSDApplication 激活 TMSDBPMN profile 时加载，不影响 TCMApplication（TCMBPMN）
# 与中医经方测试（它们读 application.yml 中的 TCM 默认值）。
#
# 本文件覆盖 application.yml 中与塔架中段设计相关的键：
#   1) ontology.main-path / ontology.bpmn-path —— 指向塔架本体与可执行 BPMN；
#   2) ontology.obda-* / abox-* —— 清空，因 TowerMidSection.owl 是纯 TBox，无 ABox 映射；
#   3) tmsd.* —— 历史设计样本 Excel 与输出目录；
#   4) spring.main.web-application-type —— 关闭内置 Web 服务器。

# -------------------- 关闭内置 Web 服务器 --------------------
# TMSD 是纯 Zeebe JobWorker（消费 tmsd-step* 作业、执行设计、写出 txt），不需要 Web 服务器。
# 运行环境（沙箱 / CI）可能注入 SERVER_PORT 或 SERVER__PORT 之类的环境变量，其优先级高于
# application.yml 中的 server.port，会导致 Spring Boot 用错误端口启动并抛
#   "Web server failed to start. Port xxxxx was already in use."
# 从而整个 Worker 启动失败。显式声明非 Web 应用类型后，server.port / SERVER_PORT /
# SERVER__PORT 一律被忽略，启动不再受端口影响。
spring:
  main:
    web-application-type: none

# -------------------- 本体与 BPMN --------------------
ontology:
  # 塔架中段本体（v16.3；含 4 个机型个体，故为 TBox+ABox）
  main-path: D:/work/Ontology/GoldenWind/ontology/TowerMidSection.owl
  # 塔架中段定制化设计流程（可执行版）：唯一权威副本，位于 ontology/bpmn 下。
  # 同目录另有源设计图 塔架中段定制化设计流程.bpmn（isExecutable="false"、无 zeebe 扩展、不可部署），仅供审阅。
  # 唯一真值文件为 ontology/bpmn/TowerMidDesign.bpmn，后续所有流程更新一律改此文件。
  bpmn-path: D:/work/Ontology/GoldenWind/ontology/bpmn/TowerMidDesign.bpmn
  # 塔架本体无 ABox 数据库映射：清空继承自 application.yml 的中医 OBDA / ABox 配置，
  # 使 TMSDOntologyJobWorker 按纯 TBox 模式初始化（不调用 OBDAHandler.init）。
  obda-path: ""
  obda-properties-path: ""
  abox-path: ""
  abox-dir: ""

# -------------------- 塔架中段设计（TMSD）专用配置 --------------------
# 历史设计（「搜索到的历史设计」）来源：两个样本 Excel。
# 老工具 towerdesign 的调用入口：drawingmain.generate_creo_parameters(geo_path, lay_path, target_path)。
tmsd:
  # 塔架几何输入（含 Description / TowerGeo / Flange / Door / V-Flange 等 sheet）
  historical-geo-path: D:/work/Ontology/GoldenWind/design/towerdesign-main/TowerGeoInput_10563080_HH130m_6段_中径4.95m_GWH182-7.5_外置_锚栓式__主体434t-20251103-2025-11-06-11-24-50.xlsx
  # 项目布局表（下段 / 中间段 / 顶段 三段布局）
  historical-layout-path: D:/work/Ontology/GoldenWind/design/towerdesign-main/项目布局表.xlsx
  # 输出目录（「需修改的模型参数及值」txt 与对比报告）
  output-dir: D:/work/Ontology/GoldenWind/OntologyMachine/OntologyFramework/tmsd-output
  # 平台所在处内径匹配容差（mm）：老程序 platSugget() 为 2.X 机型 ±6mm、其余 ±15mm
  platform-inner-diameter-tolerance-mm: 6
