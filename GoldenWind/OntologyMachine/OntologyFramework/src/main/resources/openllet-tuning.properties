# ============================================================================
# Openllet 推理器调优（第 2 级配置源，随包发布）
#
# 由 com.ocean.ontologyframework.OpenlletTuning 读取，键名与 OpenlletOptions 字段一致。
# 优先级（后者覆盖前者）：
#   1. OpenlletTuning 内置默认
#   2. 本文件
#   3. application.yml 的 openllet.tuning.*  →  再被 -Dopenllet.tuning.* 覆盖
#
# 背景：TBox 含约 366 条 owl:equivalentClass 充要定义；Openllet 的
# CDOptimizedTaxonomyBuilder 在「本体无名义量」时启用 CD 优化分类路径
# （_useCD = USE_CD_CLASSIFICATION && !TOP可展开 && !hasNominal()），
# 该路径对本体呈强非确定性耗时（15s ~ 数小时，偶发挂起）→ Worker 启动卡死。
# 实测（_harness/_sweep_ab.log，同机交错取样）：
#   默认             precompute 中位数 84.7s / 最大 94.4s
#   仅关 CD          中位数 27.3s
#   关 CD + 关高级缓存 中位数 18.7s / 最大 35.7s   ← 本文件默认值
#
# 两者均为「优化开关」，不改变推理语义；正确性以全量回归 279/279 通过为证。
# 如需临时回退（排查用），启动加：-Dopenllet.tuning.USE_CD_CLASSIFICATION=true
# ============================================================================

# 关闭 CD 优化分类器（非确定性耗时的直接来源）
USE_CD_CLASSIFICATION=false

# 关闭高级缓存（与关 CD 叠加后耗时收敛、方差最小）
USE_ADVANCED_CACHING=false
