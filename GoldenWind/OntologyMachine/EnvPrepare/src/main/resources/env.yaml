# ==================== 环境准备（EnvPrepare）通用环境配置 ====================
# 供 com.ocean.envprepare 的 EnvConfig 读取，集中存放「机器环境」（软件安装位置）与
# 「环境服务连接」（MySQL / RabbitMQ）的通用项，避免在各应用 application.yaml 中重复。
#   - 各应用 application.yaml 仅保留自身应用相关项；同名项（叶子级）以应用 application.yaml 为准。
#   - 是否启用 MySQL / RabbitMQ：由应用 application.yaml 是否声明对应的 env-prepare.mysql /
#     env-prepare.rabbitmq 节点决定；本文件仅提供连接默认值，不决定启用。
#   - 相对路径以「应用模块根目录」为基准解析。
env-prepare:
  # 通用软件安装位置（请按本机实际安装路径修改）
  java-home: 'C:\Program Files\Java\jdk-26.0.1'
  ontop-home: 'D:\work\Ontology\ontop-cli-5.5.0'
  camunda-home: 'D:\work\Ontology\c8run-8.9.6'
  rabbitmq-home: 'D:\work\Ontology\rabbitmq_server-4.3.4'

  # MySQL 连接（机器级通用默认；是否启用由应用 application.yaml 是否声明 env-prepare.mysql 决定）
  mysql:
    # MySQL Windows 服务名（由 createdb 启动）
    service-name: MySQL80
    # mysql.exe 完整路径；留空则依次尝试 PATH 中的 mysql 与常见默认安装位置
    bin: 'C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe'
    user: root
    password: zj780704

  # RabbitMQ 连接（机器级通用默认；是否启用由应用 application.yaml 是否声明 env-prepare.rabbitmq 决定）
  rabbitmq:
    host: localhost
    port: 5672
    management-port: 15672
    user: guest
    password: guest
    vhost: '/'
