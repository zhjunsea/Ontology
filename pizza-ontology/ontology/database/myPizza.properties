# 数据库连接
jdbc.url=jdbc:mysql://localhost:3306/mypizzadb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.user=root
jdbc.password=zj780704

# 本体文件（绝对路径或相对路径）
ontology=myPizza.owl

# 映射文件
mapping=myPizza.obda

# 推理模式：NONE 表示不进行本体推理，完全依赖映射数据
reasoner=NONE

# SPARQL 端点端口
port=8080

# 连接池参数（可选，有默认值）
pool.maxSize=10
pool.minIdle=2
pool.connectionTimeout=5000
pool.idleTimeout=300000
pool.maxLifetime=600000

# SPARQL Endpoint（当 .obda 文件中未定义时的回退值）
sparql.endpoint=http://localhost:8080/sparql